# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Build Main Branch
on:
  workflow_dispatch: # Allow running the workflow manually from the GitHub UI
  push:
    branches:
      - 'main'       # Run the workflow when pushing to the main branch
  pull_request:
    branches:
      - '*'          # Run the workflow for all pull requests
  release:
    types:
      - published    # Run the workflow when a new GitHub release is published

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  NuGetDirectory: ${{ github.workspace}}/nuget

defaults:
  run:
    shell: pwsh

jobs:
  create_nuget:
    name: Create NuGet Package
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0 # Get all history to allow automatic versioning using MinVer

    # Install the .NET SDK indicated in the global.json file
    - name: Setup .NET
      uses: actions/setup-dotnet@v4

    # Create the NuGet package in the folder from the environment variable NuGetDirectory
    - run: dotnet pack Jolt/Jolt.csproj --configuration Release --output ${{ env.NuGetDirectory }}
    - run: dotnet pack Jolt.Json.DotNet/Jolt.Json.DotNet.csproj --configuration Release --output ${{ env.NuGetDirectory }}
    - run: dotnet pack Jolt.Json.Newtonsoft/Jolt.Json.Newtonsoft.csproj --configuration Release --output ${{ env.NuGetDirectory }}

    # Publish the NuGet package as an artifact, so they can be used in the following jobs
    - uses: actions/upload-artifact@v5.0.0
      with:
        name: nuget
        if-no-files-found: error
        retention-days: 7
        path: ${{ env.NuGetDirectory }}/*.nupkg
  
  run_dotnet_build_and_test:
    name: Build And Test
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v3
    - name: Setup .NET    
      uses: actions/setup-dotnet@v4
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1
    - name: Setup NuGet
      uses: NuGet/setup-nuget@v1.0.5      
    - name: "Set up VSTest"
      uses: darenm/Setup-VSTest@v1.3

    # Restore packages
    - name: .NET Cross-platform Package Restore
      run: dotnet restore Jolt.sln

    # Build projects
    # NOTE: The .NET Framework step is required to directly use msbuild due to its age, dotnet build doesn't support it well.
    - name: .NET Framework Build
      run: msbuild JoltBuild.targets -p:BuildGroup=WindowsOnly -t:Build -p:Configuration=Release
    - name: .NET Cross-platform Build
      run: dotnet build JoltBuild.targets -p:BuildGroup=CrossPlatform -t:Build --configuration Release --no-restore

    # Run tests
    - name: Run .NET Framework Tests
      run: vstest.console.exe Tests/Jolt.Json.DotNetFramework.Tests/bin/Release/Jolt.Json.DotNetFramework.Tests.dll /TestAdapterPath:Tests/Jolt.Json.DotNetFramework.Tests/bin/Release/ --collect:"Code Coverage"
    - name: Run .NET Cross-platform Tests
      run: |
        dotnet test Tests/Jolt.Tests/Jolt.Tests.csproj --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./TestResults/
        dotnet test Tests/Jolt.Json.Tests/Jolt.Json.Tests.csproj --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./TestResults/

    # Create and attach code coverage report to pipeline run
    - name: Download code coverage report generator
      run: dotnet tool install -g dotnet-reportgenerator-globaltool
    - name: Generate code coverage report
      run: reportgenerator "-reports:./TestResults/**/*.cobertura.xml" "-targetdir:./CoverageReport" "-reporttypes:Badges;MarkdownSummaryGithub"
    - name: Upload test coverage report      
      uses: actions/upload-artifact@v4
      with:
        name: Code Coverage Report
        path: ./CoverageReport/

    # Generate build status badge
    - name: Create build status badge
      if: always()
      run: |
        $badgeDirectory = "./BuildStatusBadge"
        New-Item -ItemType Directory -Path $badgeDirectory -Force | Out-Null

        $jobStatus = "${{ job.status }}"
        $badgeColor = if ($jobStatus -eq "success") { "brightgreen" } else { "red" }
        $badgeLabel = "Build & Test"
        $badgeMessage = $jobStatus.ToUpper()

        # Create badge using shields.io
        $badgeUrl = "https://img.shields.io/badge/$badgeLabel-$badgeMessage-$badgeColor"
        $badgeOutputPath = "$badgeDirectory/build-status-badge.svg"

        # Download the badge
        Invoke-WebRequest -Uri $badgeUrl -OutFile $badgeOutputPath

        # Create a markdown file with badge instructions
        $readmeContent = @"
# Build Status Badge

To use this badge in your README.md, add the following markdown:

\`\`\`markdown
[![Build Status](https://github.com/${{ github.repository }}/actions/workflows/build-and-release.yml/badge.svg)](https://github.com/${{ github.repository }}/actions/workflows/build-and-release.yml)
\`\`\`

This badge reflects the status of the **Build Main Branch** workflow and monitors:
- **.NET Framework 4.7.2** build and tests
- **.NET Standard 2.0, 2.1** builds
- **.NET 8, .NET 10** builds and tests

**Job Details:**
- Build Status: $jobStatus
- Timestamp: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss UTC')
- Branch: ${{ github.ref_name }}
- Commit: ${{ github.sha }}

"@

        $readmeContent | Out-File -FilePath "$badgeDirectory/BADGE_README.md" -Encoding UTF8

        Write-Host "Build Status Badge created successfully"
        Write-Host "Status: $jobStatus"
        Write-Host "Badge Color: $badgeColor"

    - name: Upload build status badge
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Build Status Badge
        path: ./BuildStatusBadge/
        retention-days: 30
        
  add_code_coverage_summary:
    name: Add Code Coverage To Summary
    runs-on: ubuntu-latest
    needs: run_dotnet_build_and_test
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        name: Code Coverage Report
        path: ./CoverageReport
    - name: Add coverage summary to GitHub Step Summary
      run: |
        $summaryFile = Get-ChildItem -Path ./CoverageReport -Filter "SummaryGithub.md" -Recurse | Select-Object -First 1
        if ($summaryFile) {
          Get-Content $summaryFile.FullName | Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding UTF8
        } else {
          Write-Warning "SummaryGithub.md file not found in CoverageReport directory"
        }
    
  deploy:
    name: Publish Jolt NuGet Package
    # Publish only when creating a GitHub Release
    # https://docs.github.com/en/repositories/releasing-projects-on-github/managing-releases-in-a-repository
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    needs: [ run_dotnet_build_and_test, create_nuget ]
    steps:
      # Download the NuGet package created in the previous job
      - uses: actions/download-artifact@v6.0.0
        with:
          name: nuget
          path: ${{ env.NuGetDirectory }}

      # Install the .NET SDK indicated in the global.json file
      - name: Setup .NET
        uses: actions/setup-dotnet@v4

      # Publish all NuGet packages to NuGet.org
      # Use --skip-duplicate to prevent errors if a package with the same version already exists.
      # If you retry a failed workflow, already published packages will be skipped without error.
      - name: Publish NuGet package
        run: |
          foreach($file in (Get-ChildItem "${{ env.NuGetDirectory }}" -Recurse -Include *.nupkg)) {
              dotnet nuget push $file --api-key "${{ secrets.NUGET_APIKEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
          }
