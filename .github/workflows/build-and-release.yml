# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Build Main Branch
on:
  workflow_dispatch: # Allow running the workflow manually from the GitHub UI
  push:
    branches:
      - 'main'       # Run the workflow when pushing to the main branch
  pull_request:
    branches:
      - '*'          # Run the workflow for all pull requests
  release:
    types:
      - published    # Run the workflow when a new GitHub release is published

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  NuGetDirectory: ${{ github.workspace}}/nuget

defaults:
  run:
    shell: pwsh

jobs:
  create_nuget:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0 # Get all history to allow automatic versioning using MinVer

    # Install the .NET SDK indicated in the global.json file
    - name: Setup .NET
      uses: actions/setup-dotnet@v4

    # Create the NuGet package in the folder from the environment variable NuGetDirectory
    - run: dotnet pack Jolt/Jolt.csproj --configuration Release --output ${{ env.NuGetDirectory }}
    - run: dotnet pack Jolt.Json.DotNet/Jolt.Json.DotNet.csproj --configuration Release --output ${{ env.NuGetDirectory }}
    - run: dotnet pack Jolt.Json.Newtonsoft/Jolt.Json.Newtonsoft.csproj --configuration Release --output ${{ env.NuGetDirectory }}

    # Publish the NuGet package as an artifact, so they can be used in the following jobs
    - uses: actions/upload-artifact@v5.0.0
      with:
        name: nuget
        if-no-files-found: error
        retention-days: 7
        path: ${{ env.NuGetDirectory }}/*.nupkg
  
  run_test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
    - name: Run Standard Tests
      run: dotnet test Tests/Jolt.Json.Tests/Jolt.Json.Tests.csproj --configuration Release --collect:"XPlat Code Coverage" --results-directory ./TestResults/
    - name: Run Legacy Target Tests
      run: dotnet test Tests/Jolt.Json.DotNetFramework.Tests/Jolt.Json.DotNetFramework.Tests.csproj --configuration Release --collect:"XPlat Code Coverage" --results-directory ./TestResults/
    - name: Run Core Unit Tests
      run: dotnet test Tests/Jolt.Tests/Jolt.Tests.csproj --configuration Release --collect:"XPlat Code Coverage" --results-directory ./TestResults/
    - name: Download code coverage report generator
      run: dotnet tool install -g dotnet-reportgenerator-globaltool
    - name: Generate code coverage report
      run: reportgenerator "-reports:./TestResults/**/*.cobertura.xml" "-targetdir:./CoverageReport" "-reporttypes:Html"
    - name: Upload test coverage report      
      uses: actions/upload-artifact@v4
      with:
        name: Code-Coverage-Report
        path: ./CoverageReport/
    - name: Publish coverage summary
      uses: irongut/CodeCoverageSummary@v1.3.0
      with:
        filename: ./TestResults/**/*.cobertura.xml
        badge: true
        fail_below_min: true
        format: markdown
        output: file      
    - name: Add coverage summary to workflow summary
      run: cat github_summary.md >> $GITHUB_STEP_SUMMARY
        
  deploy:
    # Publish only when creating a GitHub Release
    # https://docs.github.com/en/repositories/releasing-projects-on-github/managing-releases-in-a-repository
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    needs: [ run_test, create_nuget ]
    steps:
      # Download the NuGet package created in the previous job
      - uses: actions/download-artifact@v6.0.0
        with:
          name: nuget
          path: ${{ env.NuGetDirectory }}

      # Install the .NET SDK indicated in the global.json file
      - name: Setup .NET
        uses: actions/setup-dotnet@v4

      # Publish all NuGet packages to NuGet.org
      # Use --skip-duplicate to prevent errors if a package with the same version already exists.
      # If you retry a failed workflow, already published packages will be skipped without error.
      - name: Publish NuGet package
        run: |
          foreach($file in (Get-ChildItem "${{ env.NuGetDirectory }}" -Recurse -Include *.nupkg)) {
              dotnet nuget push $file --api-key "${{ secrets.NUGET_APIKEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
          }
